<svg xmlns="http://www.w3.org/2000/svg" width="1242" height="1660" viewBox="0 0 1242 1660"><defs><filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#292841" flood-opacity=".12"/></filter></defs><rect width="1242" height="1660" fill="#f5f6fb"/><circle cx="1120" cy="135" r="185" fill="#ece9ff"/><circle cx="85" cy="1460" r="205" fill="#eeeaff"/><rect x="92" y="74" width="54" height="54" rx="16" fill="#6f5cff" stroke="none"/><path d="M108 90h22v4h-22zm0 9h22v4h-22zm0 9h15v4h-15z" fill="white"/><text x="164" y="113" font-family="Microsoft YaHei, sans-serif" font-size="34" fill="#232337" font-weight="700">TabNote</text><text x="842" y="111" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#77788b" font-weight="500">CHROME SIDE PANEL  /  效率工具</text><text x="96" y="235" font-family="Microsoft YaHei, sans-serif" font-size="66" fill="#242438" font-weight="700">把网页里的好内容，</text><text x="96" y="319" font-family="Microsoft YaHei, sans-serif" font-size="66" fill="#242438" font-weight="700">顺手变成自己的笔记。</text><text x="98" y="382" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#68697d" font-weight="500">摘录 · 引用 · 截图 · 整理，一侧栏完成</text><rect x="96" y="420" width="300" height="51" rx="25" fill="#eae7ff" stroke="none"/><text x="119" y="454" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#5d4be2" font-weight="700">给浏览器一个记笔记搭子</text><g filter="url(#shadow)"><rect x="100" y="520" width="1042" height="660" rx="28" fill="white" stroke="#e5e6ef"/><rect x="100" y="520" width="1042" height="62" rx="28" fill="#fbfbfe" stroke="none"/><circle cx="137" cy="551" r="8" fill="#ff8d88"/><circle cx="161" cy="551" r="8" fill="#ffc85e"/><circle cx="185" cy="551" r="8" fill="#64c998"/><rect x="225" y="535" width="500" height="32" rx="14" fill="#f0f0f6" stroke="none"/><text x="245" y="558" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#7d7d8f" font-weight="500">research.example.com</text><text x="260" y="652" font-family="Microsoft YaHei, sans-serif" font-size="26" fill="#28283b" font-weight="700">研究资料：把灵感留在浏览器里</text><text x="260" y="697" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#77788b" font-weight="500">读到有用内容，不必切换窗口。</text><rect x="260" y="730" width="450" height="116" rx="14" fill="#f5f4fb" stroke="none"/><text x="282" y="770" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#55566a" font-weight="500">资料收集的关键，是在阅读当下</text><text x="282" y="802" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#55566a" font-weight="500">顺手留下值得回看的重点。</text><path d="M260 882h440m-440 40h400m-400 40h425" stroke="#e7e7ef" stroke-width="9" stroke-linecap="round"/><rect x="770" y="598" width="348" height="562" rx="22" fill="white" stroke="#e7e8f0"/><rect x="794" y="618" width="36" height="36" rx="11" fill="#6f5cff" stroke="none"/><path d="M803 628h18v4h-18zm0 8h18v4h-18zm0 8h12v4h-12z" fill="white"/><text x="842" y="645" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#29293b" font-weight="700">TabNote</text><text x="794" y="694" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#252538" font-weight="700">AI 产品调研笔记</text><text x="794" y="724" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#85869a" font-weight="500">research.example.com</text><rect x="794" y="742" width="298" height="42" rx="12" fill="#f6f6fa" stroke="#e7e7ef"/><text x="812" y="769" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#5b5c70" font-weight="500">切换笔记  ⌄</text><text x="794" y="823" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#29293b" font-weight="700">产品判断</text><text x="794" y="855" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#626377" font-weight="500">网页阅读，不打断思路。</text><rect x="794" y="880" width="298" height="90" rx="13" fill="#f0edff" stroke="none"/><text x="812" y="914" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#5b4be0" font-weight="500">“一页一份笔记，</text><text x="812" y="940" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#5b4be0" font-weight="500">浏览时顺手留下重点。”</text><rect x="794" y="994" width="298" height="44" rx="11" fill="#fafaff" stroke="#e7e7ef"/><text x="812" y="1023" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#706f84" font-weight="500">编辑        预览</text><rect x="794" y="1056" width="298" height="54" rx="14" fill="#232337" stroke="none"/><text x="912" y="1090" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="white" font-weight="600">笔记库   ↗</text></g><text x="96" y="1268" font-family="Microsoft YaHei, sans-serif" font-size="43" fill="#6f5cff" font-weight="700">别让“稍后整理”变成“再也没整理”。</text><text x="98" y="1340" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#68697d" font-weight="500">打开网页，就能开始记录。</text><text x="92" y="1570" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#77788b" font-weight="500">TABNOTE  ·  浏览器里的轻量笔记侧栏</text><text x="1035" y="1570" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#77788b" font-weight="600">01 / 04</text></svg>