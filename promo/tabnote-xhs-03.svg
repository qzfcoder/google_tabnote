l="#77788b" font-weight="500">读到有用内容，不必切换窗口。</text><rect x="260" y="665" width="450" height="116" rx="14" fill="#f5f4fb" stroke="none"/><text x="282" y="705" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#55566a" font-weight="500">资料收集的关键，是在阅读当下</text><text x="282" y="737" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#55566a" font-weight="500">顺手留下值得回看的重点。</text><path d="M260 817h440m-440 40h400m-400 40h425" stroke="#e7e7ef" stroke-width="9" stroke-linecap="round"/><rect x="770" y="533" width="348" height="562" rx="22" fill="white" stroke="#e7e8f0"/><rect x="794" y="553" width="36" height="36" rx="11" fill="#6f5cff" stroke="none"/><path d="M803 563h18v4h-18zm0 8h18v4h-18zm0 8h12v4h-12z" fill="white"/><text x="842" y="580" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#29293b" font-weight="700">TabNote</text><text x="794" y="629" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#252538" font-weight="700">AI 产品调研笔记</text><text x="794" y="659" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#85869a" font-weight="500">research.example.com</text><rect x="794" y="677" width="298" height="42" rx="12" fill="#f6f6fa" stroke="#e7e7ef"/><text x="812" y="704" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#5b5c70" font-weight="500">切换笔记  ⌄</text><text x="794" y="758" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#29293b" font-weight="700">产品判断</text><text x="794" y="790" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#626377" font-weight="500">网页阅读，不打断思路。</text><rect x="794" y="815" width="298" height="90" rx="13" fill="#f0edff" stroke="none"/><text x="812" y="849" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#5b4be0" font-weight="500">“一页一份笔记，</text><text x="812" y="875" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#5b4be0" font-weight="500">浏览时顺手留下重点。”</text><rect x="794" y="929" width="298" height="44" rx="11" fill="#fafaff" stroke="#e7e7ef"/><text x="812" y="958" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#706f84" font-weight="500">编辑        预览</text><rect x="794" y="991" width="298" height="54" rx="14" fill="#232337" stroke="none"/><text x="912" y="1025" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="white" font-weight="600">笔记库   ↗</text></g><rect x="96" y="1160" width="1050" height="230" rx="24" fill="white" stroke="#e8e8f0"/><text x="132" y="1215" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#77788b" font-weight="600">网页右键菜单</text><rect x="132" y="1240" width="270" height="52" rx="13" fill="#f1eeff" stroke="none"/><text x="154" y="1275" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#5d4be2" font-weight="700">❝  引用选中文字</text><rect x="420" y="1240" width="270" height="52" rx="13" fill="#f7f7fa" stroke="none"/><text x="442" y="1275" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#434458" font-weight="600">✦  摘要选中文字</text><rect x="708" y="1240" width="270" height="52" rx="13" fill="#f7f7fa" stroke="none"/><text x="730" y="1275" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#434458" font-weight="600">▧  截图当前页面</text><text x="132" y="1353" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#55566a" font-weight="600">摘录 · 引用 · 标记 · 摘要 · 截图</text><text x="96" y="1465" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#55566a" font-weight="500">复制的图片也能粘贴进笔记，编辑时直接查看。</text><text x="92" y="1570" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#77788b" font-weight="500">TABNOTE  ·  浏览器里的轻量笔记侧栏</text><text x="1035" y="1570" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#77788b" font-weight="600">03 / 04</text></svg>